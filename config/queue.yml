default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # one thread per reply being written: a stream holds its thread for 5 to 30 seconds
    - queues: llm
      threads: <%= ENV.fetch("LLM_THREADS", 10) %> # a stream mostly waits on the network: threads are cheap, the DB pool is the limit
      processes: 1
      polling_interval: 0.1
    - queues: "*"
      threads: 3
      processes: 1
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
